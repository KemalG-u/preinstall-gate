version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/moduller/model-kapisi"
      - "/moduller/proje-hafizasi"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      all-updates:
        patterns: ["*"]
